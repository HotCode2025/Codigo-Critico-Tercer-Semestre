<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel, Tijera: Ultimate</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-screen">
        <button class="audio-ctrl" onclick="toggleMusic()">MUSIC: ON/OFF</button>

        <audio id="bg-music" loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>

        <header class="hud-top">
            <div class="player-bar p1">
                <div class="avatar">👨‍🚀</div>
                <div class="hp-container">
                    <div class="hp-label"><span>Jugador Codigo Critico</span> <span id="p1-hp-text">100%</span></div>
                    <div class="hp-bar-bg"><div id="p1-hp-fill" class="hp-fill p1-hp"></div></div>
                </div>
            </div>

            <div class="match-info">
                <h1>Rock, Paper and Scissor: ULTIMATE</h1>
                <div class="match-score"><span id="p1-score">0</span> - <span id="p2-score">0</span></div>
            </div>

            <div class="player-bar p2">
                <div class="avatar">👽</div>
                <div class="hp-container">
                    <div class="hp-label"><span>PC</span> <span id="p2-hp-text">100%</span></div>
                    <div class="hp-bar-bg"><div id="p2-hp-fill" class="hp-fill p2-hp"></div></div>
                </div>
            </div>
        </header>

        <main class="battle-stage">
            <div id="ship-p1" class="ship ship-p1">🚀</div>
            <div class="center-overlay">
                <div id="fx-layer" class="combat-fx">
                    <div id="fx-text"></div>
                    <div id="fx-icon"></div>
                </div>
                <button id="reset-btn" class="btn-reset" onclick="reiniciarJuego()">REINICIAR MISIÓN</button>
            </div>
            <div id="ship-p2" class="ship ship-p2">🛸</div>
        </main>

        <footer class="hud-bottom">
            <div class="status-panel">
                <div class="label">SISTEMA</div>
                <div id="status-text" class="status-val">ONLINE</div>
            </div>

            <div class="attack-selector" id="controls">
                <button class="btn-attack" onclick="jugar(1)"><span>✊</span><label>ROCK</label></button>
                <button class="btn-attack" onclick="jugar(2)"><span>📄</span><label>PAPER</label></button>
                <button class="btn-attack" onclick="jugar(3)"><span>✂️</span><label>SCISSORS</label></button>
            </div>

            <div class="log-panel">
                <div id="log" class="combat-log">
                    <div>> ESPERANDO ÓRDENES...</div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
